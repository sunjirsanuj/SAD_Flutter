name: zikir_tracker
description: Offline personal Zikir activity and progress tracker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.69.2
  google_fonts: ^8.2.1
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#064B32"
  image: assets/icons/app_icon.png

  android: true
  ios: false

  android_12:
    color: "#064B32"
    image: assets/icons/app_icon.png
    icon_background_color: "#064B32"

